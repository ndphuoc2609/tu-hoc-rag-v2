services:
  - type: web
    name: tuhoc-rag-v2
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-6-luna
# KHONG dung Postgres cua Render (free het han sau 90 ngay).
# DATABASE_URL tro toi Neon Postgres: set trong Render Dashboard >
# service > Environment (connection string dang pooled, co sslmode=require).
# Neon ho tro pgvector; app tu chay CREATE EXTENSION vector luc startup.
