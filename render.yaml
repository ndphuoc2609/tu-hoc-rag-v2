services:
  - type: web
    name: tuhoc-rag-v2
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tuhoc-db
          property: connectionString
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-6-luna
databases:
  - name: tuhoc-db
    plan: free
    postgresMajorVersion: "16"
